name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Check formatting with Black
        run: |
          black --check .

      - name: Compile Python files
        run: |
          python -m py_compile animate.py controller.py quadcopter.py run_simulation.py simulator.py test_smoke.py test_visualization.py __init__.py scripts/generate_ci_artifacts.py

      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover
          coverage report
          coverage xml

      - name: Generate CI artifacts
        if: matrix.python-version == '3.12'
        run: |
          python scripts/generate_ci_artifacts.py --output-dir ci_artifacts

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload simulation artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: simulation-artifacts
          path: ci_artifacts/
